name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    outputs:
      server_audit: ${{ steps.server-audit.outputs.result }}
      client_audit: ${{ steps.client-audit.outputs.result }}
      server_depcheck: ${{ steps.server-depcheck.outputs.result }}
      client_depcheck: ${{ steps.client-depcheck.outputs.result }}
      semgrep_result: ${{ steps.semgrep.outputs.result }}
      semgrep_errors: ${{ steps.semgrep.outputs.errors }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Server npm audit (high+)
        id: server-audit
        working-directory: server
        run: |
          if npm audit --omit=dev --audit-level=high; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
      - name: Client npm audit (high+)
        id: client-audit
        working-directory: client
        run: |
          if npm audit --omit=dev --audit-level=high; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
      - name: Server depcheck (SAST-lite)
        id: server-depcheck
        working-directory: server
        run: |
          npx depcheck --json > depcheck.json || true
          MISSING=$(cat depcheck.json | jq '.missing | length')
          UNUSED=$(cat depcheck.json | jq '.dependencies | length')
          if [ "$MISSING" -gt 0 ]; then
            echo "result=failed" >> $GITHUB_OUTPUT
          else
            echo "result=passed" >> $GITHUB_OUTPUT
          fi
          echo "missing=$MISSING" >> $GITHUB_OUTPUT
          echo "unused=$UNUSED" >> $GITHUB_OUTPUT
      - name: Client depcheck (SAST-lite)
        id: client-depcheck
        working-directory: client
        run: |
          npx depcheck --json > depcheck.json || true
          MISSING=$(cat depcheck.json | jq '.missing | length')
          UNUSED=$(cat depcheck.json | jq '.dependencies | length')
          if [ "$MISSING" -gt 0 ]; then
            echo "result=failed" >> $GITHUB_OUTPUT
          else
            echo "result=passed" >> $GITHUB_OUTPUT
          fi
          echo "missing=$MISSING" >> $GITHUB_OUTPUT
          echo "unused=$UNUSED" >> $GITHUB_OUTPUT
      - name: Semgrep SAST (OWASP Top 10)
        id: semgrep
        run: |
          pipx install semgrep
          semgrep --config p/owasp-top-ten --severity ERROR --json --output semgrep.json || true
          ERRORS=$(cat semgrep.json | jq '.results | length')
          if [ "$ERRORS" -gt 0 ]; then
            echo "result=failed" >> $GITHUB_OUTPUT
          else
            echo "result=passed" >> $GITHUB_OUTPUT
          fi
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
      - name: Upload Semgrep Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

  server-tests:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.secrets-check.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Secrets
        id: secrets-check
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.JWT_SECRET }}" ] || [ -z "${{ secrets.JWT_REFRESH_SECRET }}" ]; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "Missing secrets for server-tests; skipping."
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        if: ${{ steps.secrets-check.outputs.skipped != 'true' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        if: ${{ steps.secrets-check.outputs.skipped != 'true' }}
        run: npm ci
      - name: Test
        working-directory: server
        if: ${{ steps.secrets-check.outputs.skipped != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRES_IN: 7d
          JWT_REFRESH_EXPIRES_IN: 30d
        run: npm test -- --runInBand

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Test
        working-directory: client
        run: npm test

  ui-flow:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.secrets-check.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Secrets
        id: secrets-check
        run: |
          if [ -z "${{ secrets.CRM_BASE_URL }}" ] || [ -z "${{ secrets.CRM_EMAIL }}" ] || [ -z "${{ secrets.CRM_PASSWORD }}" ]; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "Missing secrets for ui-flow; skipping."
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        if: ${{ steps.secrets-check.outputs.skipped != 'true' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install Client Deps
        working-directory: client
        if: ${{ steps.secrets-check.outputs.skipped != 'true' }}
        run: npm ci
      - name: Install Playwright Browsers
        if: ${{ steps.secrets-check.outputs.skipped != 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Run UI Flow
        env:
          CRM_BASE_URL: ${{ secrets.CRM_BASE_URL }}
          CRM_EMAIL: ${{ secrets.CRM_EMAIL }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
          NODE_PATH: client/node_modules
        if: ${{ steps.secrets-check.outputs.skipped != 'true' }}
        run: node tools/playwright/run-flow.js
      - name: Upload UI Flow Artifacts
        if: ${{ always() && steps.secrets-check.outputs.skipped != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-flow-artifacts
          path: |
            output/playwright/summary.json
            output/playwright/*.png

  release-gate:
    runs-on: ubuntu-latest
    needs: [security-audit, server-tests, client-tests, ui-flow]
    if: ${{ always() }}
    steps:
      - name: Release Gate Summary
        run: |
          echo "security-audit (server): ${{ needs.security-audit.outputs.server_audit }}"
          echo "security-audit (client): ${{ needs.security-audit.outputs.client_audit }}"
          echo "depcheck (server): ${{ needs.security-audit.outputs.server_depcheck }}"
          echo "depcheck (client): ${{ needs.security-audit.outputs.client_depcheck }}"
          echo "semgrep (OWASP): ${{ needs.security-audit.outputs.semgrep_result }} (errors: ${{ needs.security-audit.outputs.semgrep_errors }})"
          echo "server-tests: ${{ needs.server-tests.result }}"
          echo "server-tests skipped: ${{ needs.server-tests.outputs.skipped }}"
          echo "client-tests: ${{ needs.client-tests.result }}"
          echo "ui-flow: ${{ needs.ui-flow.result }}"
          echo "ui-flow skipped: ${{ needs.ui-flow.outputs.skipped }}"
      - name: Fail if tests did not pass
        run: |
          if [ "${{ needs.security-audit.outputs.server_audit }}" = "failed" ]; then
            echo "Release gate warning: server npm audit reported high+ issues."
          fi
          if [ "${{ needs.security-audit.outputs.client_audit }}" = "failed" ]; then
            echo "Release gate warning: client npm audit reported high+ issues."
          fi
          if [ "${{ needs.security-audit.outputs.server_depcheck }}" = "failed" ]; then
            echo "Release gate warning: server depcheck found missing dependencies."
          fi
          if [ "${{ needs.security-audit.outputs.client_depcheck }}" = "failed" ]; then
            echo "Release gate warning: client depcheck found missing dependencies."
          fi
          if [ "${{ needs.security-audit.outputs.semgrep_result }}" = "failed" ]; then
            echo "Release gate failed: semgrep found ERROR-level issues."
            exit 1
          fi
          if [ "${{ needs.server-tests.result }}" = "failure" ]; then
            echo "Release gate failed: server-tests failed."
            exit 1
          fi
          if [ "${{ needs.client-tests.result }}" = "failure" ]; then
            echo "Release gate failed: client-tests failed."
            exit 1
          fi
          if [ "${{ needs.ui-flow.result }}" = "failure" ]; then
            echo "Release gate failed: ui-flow failed."
            exit 1
          fi
          if [ "${{ needs.server-tests.outputs.skipped }}" = "true" ]; then
            echo "Release gate warning: server-tests skipped (missing secrets)."
          fi
          if [ "${{ needs.ui-flow.outputs.skipped }}" = "true" ]; then
            echo "Release gate warning: ui-flow skipped (missing CRM secrets)."
          fi

      - name: Update Security Checklist (CI Summary)
        uses: actions/checkout@v4
      - name: Append CI SAST Summary
        run: |
          SUMMARY_FILE="SECURITY_HARDENING_CHECKLIST.md"
          echo "" >> "$SUMMARY_FILE"
          echo "<!-- CI_SAST_REPORT_START -->" >> "$SUMMARY_FILE"
          echo "## CI SAST Ozeti" >> "$SUMMARY_FILE"
          echo "- Tarih: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$SUMMARY_FILE"
          echo "- Semgrep errors: ${{ needs.security-audit.outputs.semgrep_errors }}" >> "$SUMMARY_FILE"
          echo "- Semgrep status: ${{ needs.security-audit.outputs.semgrep_result }}" >> "$SUMMARY_FILE"
          echo "<!-- CI_SAST_REPORT_END -->" >> "$SUMMARY_FILE"
      - name: Upload Checklist
        uses: actions/upload-artifact@v4
        with:
          name: security-checklist
          path: SECURITY_HARDENING_CHECKLIST.md
